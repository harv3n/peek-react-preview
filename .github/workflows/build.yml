name: Build Peek

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Package extension
        run: npx vsce package --out peek-react-preview.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: peek-react-preview
          path: peek-react-preview.vsix
          if-no-files-found: error